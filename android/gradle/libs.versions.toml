[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
composeBom = "2026.09.00"
material3 = "1.5.0-alpha29"
activityCompose = "1.13.0"
composeCompiler = "2.4.20"
kotlinxSerialization = "1.11.0"
navigation3 = "1.2.0"
